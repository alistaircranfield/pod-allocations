<script>
(function () {
'use strict';
const M = window.Model, M2 = window.Model2;
const gbp = x => '£' + Math.round(x).toLocaleString('en-GB');
const num = (x, d) => d ? Number(x).toFixed(d) : Math.round(x).toLocaleString('en-GB');
const pct = x => Math.round(x * 100) + '%';
const pc1 = x => (Math.round(x * 1000) / 10).toFixed(1).replace(/\.0$/, '') + '%';
const clone = o => JSON.parse(JSON.stringify(o));
const get = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
const set = (o, p, v) => { const k = p.split('.'), l = k.pop(); k.reduce((a, x) => a[x], o)[l] = v; };
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ico = (id, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };

/* ---------- presets ---------- */
const STABLE = s => { s.core.stable = true; s.core.wholeLines = true; s.core.lumpy = 0; Object.values(s.groups).forEach(g => { if (g.fill != null) g.fill = 1; g.recruit = 0; g.induct = 0; if (g.supernum != null) { g.supernum = 0; g.signoff = 0; } }); s.accp.recruit = 0; s.absence.sick = 0; s.absence.other = 0; s.core.extPlacement = 0; };
const PRESETS = [
  { id: 'now', tg: ['10 SCFs'], n: 'Last year, averaged', ch: '', hid: '', d: 'Today’s staff, averaged over a year', ic: 'clock', fn: s => s },
  { id: 'stable', tg: ['no sickness or turnover', 'any share at Fairfield'], n: 'Ideal year, nothing goes wrong', ch: 'No sickness, leave gaps or turnover', hid: 'Any share of on-calls at Fairfield · whole rota lines only', d: 'No sickness, gaps or turnover, and doctors can work any share of their shifts at either site: the least that could work in theory', ic: 'min', fn: (s, pr) => { STABLE(s); s.core.fghCap = 1; s.groups.scf.posts = 0; s.groups.sd.posts = 15; s.groups.sd.line = 'sd10'; } },
  { id: 'month', tg: ['11 SCFs', 'October roster'], n: 'October 2026 roster', ch: 'Everyone full time, as rostered', hid: '', d: 'Who is on the Allocate roster this month', ic: 'cal', fn: s => {   // who is on the Allocate roster this month, by group
    const G = s.groups, fix = (k, o) => Object.assign(G[k], o);
    fix('scf', { posts: 11, recruit: 0, lt: 0 });
    ['icm3', 'icm2', 'icm1', 'anaes'].forEach(k => fix(k, { fill: 14.6 / 13, lt: 0 }));   // 16 airway trainees, 14.6 WTE
    fix('jcf', { posts: 5, lt: 0 }); fix('accs', { posts: 0 }); fix('imt', { posts: 4, fill: 1, lt: 0 }); fix('fy2', { posts: 4, lt: 0 }); fix('other', { posts: 1, lt: 0 });
  } },
  { id: 'fulldean', tg: ['every post filled'], n: 'Every funded post filled', ch: 'No gaps between postholders', hid: '', d: 'Every funded post filled: 10 SCFs with no gaps between people, every deanery post and every ACCS post', ic: 'school', fn: s => { Object.assign(s.groups.scf, { recruit: 0 }); Object.assign(s.groups.accs, { fill: 1 }); Object.assign(s.groups.icm3, { posts: 2, fill: 1, lt: 0 }); Object.assign(s.groups.icm2, { posts: 7, fill: 1, lt: 0 }); Object.assign(s.groups.icm1, { posts: 1, fill: 1, lt: 0 }); Object.assign(s.groups.anaes, { posts: 3, fill: 1, lt: 0 }); } },
  { id: 'allsd', tg: ['10 specialty doctors', '10 PA'], n: '10 specialty doctor posts instead of SCFs', ch: '', hid: '', d: 'The 10 SCF posts become specialty doctors on 10 PA', ic: 'swap', fn: s => { s.groups.scf.posts = 0; s.groups.sd.posts = 10; s.groups.sd.line = 'sd10'; } },
  { id: 'value', tg: ['14 specialty doctors'], n: '14 specialty doctor posts instead of SCFs', ch: '', hid: '', d: '14 specialty doctors: more Fairfield cover for about what locums cost', ic: 'down', rec: 1, fn: (s, pr) => { s.groups.scf.posts = 0; s.groups.sd.posts = 14; s.groups.sd.line = 'sd10'; } },
  { id: 'nights2', tg: ['extra weekday nights'], n: 'Everyone on extra weekday nights', ch: '2 extra weekday night sets for everyone', hid: '', d: 'Every doctor on the 9-week template with two extra weekday night sets', ic: 'moon', fn: s => { ['scf', 'sd', 'icm1', 'icm2', 'icm3', 'anaes', 'jcf', 'accs', 'imt', 'fy2', 'other'].forEach(k => { s.groups[k].line = 'scf_2n'; }); } },
  { id: 'fghline', tg: ['6 of the 10 SCFs', '6-week Fairfield line', 'funded by Fairfield'], n: '6 SCFs on a Fairfield rota', ch: '6-week Fairfield line, funded by Fairfield', hid: 'At least 40% of their on-calls at Salford', d: 'Six of the ten SCFs form a Fairfield team on a 6-week line with every worked weekend on call', ic: 'hosp', fn: s => { s.core.fghPosts = 6; s.core.funding = 'split'; s.core.fghLine = 'fgh6'; } },
  { id: 'nogaps', tg: ['24 specialty doctors', 'up to half their on-calls at Fairfield'], n: '24 specialty doctor posts', ch: '', hid: 'Up to half their on-calls at Fairfield', d: 'The fewest specialty doctors that cover at least 95% of Fairfield nights and weekends, with up to half their on-calls at Fairfield', ic: 'shield', rec: 1, fn: (s, pr) => { s.core.fghCap = 0.5; s.groups.scf.posts = 0; s.groups.sd.posts = 24; s.groups.sd.line = 'sd10'; } }
];
/* ---------- a plan in the web address: the link holds every change from its starting plan, nothing is stored ---------- */
const b64 = t => { let bin = ''; new TextEncoder().encode(t).forEach(c => bin += String.fromCharCode(c)); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64 = t => { t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; return new TextDecoder().decode(Uint8Array.from(atob(t), c => c.charCodeAt(0))); };
const LINK = (() => { try { const m = location.hash.match(/^#plan=([\w-]+)$/); if (!m) return null; const o = JSON.parse(unb64(m[1])); return o && o.v === 1 && PRESETS.find(x => x.id === o.b) ? o : null; } catch (e) { return null; } })();
let MODE = LINK && LINK.m === 'practice' ? 'practice' : 'theory';
const practice = () => MODE === 'practice';
const NOW = M2.now(); NOW.core.practice = practice();
const syncT = s => { const D = s.demand; D.airT = Object.assign({}, D.air); D.naT = Object.assign({}, D.na); D.fghT = Object.assign({}, D.fgh); return s; };
const make = id => { const p = PRESETS.find(x => x.id === id); const s = M2.now(); s.core.practice = practice(); p.fn(s, practice()); M2.syncAccp(s); syncT(s); s.name = p.n; return s; };
let S = make('now'), active = 'now', path = ['home'], saved = [], db = null, canSave = false, lastRes = null, nowRes = null, query = '';
const presetRes = {}, savedRes = {};
let costView = store.get('rm.costView') || 'bridge', costSplit = store.get('rm.costSplit') || 'total', coverView = store.get('rm.coverView') || 'bars';
let extraCols = [];

/* ---------- grades ---------- */
const GRADES = [
  { k: 'icm3', n: 'ICM stage 3', ic: 'school', grp: 'Deanery', kind: 'dean' },
  { k: 'icm2', n: 'ICM stage 2', ic: 'school', grp: 'Deanery', kind: 'dean' },
  { k: 'icm1', n: 'ICM stage 1', ic: 'school', grp: 'Deanery', kind: 'dean' },
  { k: 'anaes', n: 'Anaesthesia', ic: 'school', grp: 'Deanery', kind: 'dean' },
  { k: 'jcf', n: 'JCF', ic: 'person', grp: 'Other residents', kind: 'sub' },
  { k: 'accs', n: 'ACCS', ic: 'person', grp: 'Other residents', kind: 'dean' },
  { k: 'imt', n: 'IMT', ic: 'person', grp: 'Other residents', kind: 'dean' },
  { k: 'fy2', n: 'FY2', ic: 'person', grp: 'Other residents', kind: 'dean' },
  { k: 'other', n: 'ED, neuro, renal, RCF', ic: 'person', grp: 'Other residents', kind: 'dean' }
];
const ALLW = [['scf', 'SCF', 'badge'], ['sd', 'Specialty doctor', 'badge'], ['icm3', 'ICM stage 3', 'school'], ['icm2', 'ICM stage 2', 'school'], ['icm1', 'ICM stage 1', 'school'], ['anaes', 'Anaesthesia', 'school'], ['accp', 'ACCPs', 'stethoscope'], ['jcf', 'JCF', 'person'], ['accs', 'ACCS', 'person'], ['imt', 'IMT', 'person'], ['fy2', 'FY2', 'person'], ['other', 'ED, neuro, renal, RCF', 'person']];
const wteK = (s, k) => k === 'accp' ? ['accpA', 'accpF', 'accpT', 'accpO'].reduce((a, x) => a + M2.wteOf(s, x), 0) : M2.wteOf(s, k);
const wteAll = s => ALLW.reduce((a, [k]) => a + wteK(s, k), 0);
const LINES_FOR = { core: ['scf_current', 'scf_2n', 'sd13', 'sd10', 'custom'], dean: ['scf_current', 'scf_2n', 'trainee'], accp: ['scf_current', 'accp'] };
const lineName = k => k === 'custom' ? 'Edit the 9-week template' : k === 'trainee' ? 'Edit the trainee template' : k === 'accp' ? 'Edit the ACCP template' : (M.LINES[k] ? (n => n.charAt(0).toUpperCase() + n.slice(1))(M.LINES[k].name.replace('Proposed: ', '')) : k);
const thumb = grid => `<div class="thumb">${grid.map(w => `<div>${[...w].map(c => `<i class="${c === '.' ? '' : c}"></i>`).join('')}</div>`).join('')}</div>`;

/* ---------- control registry: lets search and "changed from Now" find every setting ---------- */
const REG = {};
const reg = (p, label, page) => { if (!REG[p]) REG[p] = { label, page }; };
const fmtV = (v) => typeof v === 'boolean' ? (v ? 'On' : 'Off') : Array.isArray(v) ? (v.length && typeof v[0] === 'number' ? v.map(m => M2.MONTHS[m]).join(' ') : 'Edited') : typeof v === 'number' ? (Math.abs(v) < 1 && v % 1 ? pct(v) : num(v, v % 1 ? 1 : 0)) : String(v);

const sv = (p, v) => `--v:${v}%`;
const stepC = (p, label, ic, o = {}) => { reg(p, label, o.page); const v = get(S, p); return `<div class="row2"><span class="ri">${ico(ic, 'sm')}</span><span class="rl">${label}${o.info ? iI(o.info) : ''}</span><span class="stp"><button data-p="${p}" data-d="${-(o.step || 1)}" data-min="${o.min ?? 0}" data-max="${o.max ?? 999}" aria-label="Less ${esc(label)}">−</button><b class="num">${o.fmt ? o.fmt(v) : num(v, (o.step || 1) % 1 ? 1 : 0)}</b><button data-p="${p}" data-d="${o.step || 1}" data-min="${o.min ?? 0}" data-max="${o.max ?? 999}" aria-label="More ${esc(label)}">+</button></span></div>`; };
const slideC = (p, label, ic, o = {}) => { reg(p, label, o.page); const v = get(S, p), mn = o.min ?? 0, mx = o.max ?? 1, f = (v - mn) / (mx - mn) * 100; return `<div class="row2"><span class="ri">${ico(ic, 'sm')}</span><span class="rl">${label}${o.info ? iI(o.info) : ''}</span><b class="num" data-out="${p}">${(o.fmt || pct)(v)}</b><input class="rg" type="range" data-p="${p}" min="${mn}" max="${mx}" step="${o.step || 0.01}" value="${v}" style="${sv(p, f)}" aria-label="${esc(label)}" data-fmt="${o.fmtKey || 'pct'}"></div>`; };
const togC = (p, label, ic, cls = '', page) => { reg(p, label, page); const v = !!get(S, p); return `<button class="chip ${v ? 'y' : ''} ${cls}" data-t="${p}" aria-pressed="${v}">${ico(ic, 'sm')}${label}</button>`; };
const choiceC = (p, label, opts, page) => { reg(p, label, page); const v = get(S, p); return `<div class="chips">${opts.map(([val, t, ic]) => `<button class="chip ${String(typeof val === 'boolean' ? !!v : v) === String(val) ? 'y' : ''}" data-c="${p}" data-v="${esc(val)}">${ic ? ico(ic, 'sm') : ''}${t}</button>`).join('')}</div>`; };
const BLKINFO = {
  'Time': 'How long people stay, how long a post is empty between people, and the months before someone counts fully. A post empty between people costs nothing and covers nothing.',
  'Off the rota': 'Leave, study leave, bank holidays and non-clinical days come off weekday days only, never nights or weekends. Sickness comes off every shift (Absence and seasons page).',
  'Work schedule': 'Everyone works one schedule, set under Work schedule on the Inputs page; SCFs and specialty doctors can be given a different one there. Part-time people work the trust’s 80, 70, 60 or 50% versions. ACCPs have their own Agenda for Change line, set on the ACCP page.',
  'Can cover': 'Which shifts this group can fill. Trainees never work Fairfield nights or weekends; only signed-off SCFs and specialty doctors do.',
  'People': 'Posts, how many are filled on average, and part-time working. Deanery numbers are WTE, so part-time changes the head count, not the cover.',
  'Library': 'The trust’s 9-week template and versions of it. Every one keeps the same nights and weekends; part-time versions are built from the trust’s own 80, 70, 60 and 50% templates.',
  'On-costs': 'Employer pension and National Insurance on top of pay. Applied to every group we employ; not to locums.',
  'Recruitment': 'One-off cost each time a post is filled.',
  'Skills': 'Transfer-trained ACCPs count as airway on Salford short days only. FGH-trained can do the Fairfield weekday long day. Airway-trained count as full airway on any shift.',
  'SCF and specialty doctor teams': 'Posts Fairfield funds fill Fairfield first but keep a share of on-calls at Salford for their skills. Posts Salford funds fill Salford first, then Fairfield gaps up to the limit.',
  'Leave by month': 'From Allocate, Sep 2025 to Aug 2026: leave peaks in October, March and the summer. Switch off to spread it evenly.',
  'Absence by month': 'From Allocate: sickness peaks in December and January, and April to May. Switch off to spread it evenly.'
};
const blk = (ic, t, body, info) => { info = info || BLKINFO[t]; return `<div class="blk"><div class="bh">${ico(ic, 'sm')}<span class="lab">${t}</span>${info ? iI(info) : ''}</div>${body}</div>`; };
const head = (title, sub) => path.length > 1 ? `<div class="ph2"><button class="bk" data-back="1" aria-label="Back to ${esc(backName())}">${ico('back', 'sm')}</button><span class="pt">${title}</span>${sub ? `<span class="ps num">${sub}</span>` : ''}</div>` : '';
const NAMES = { home: 'Inputs', staff: 'Staff', core: 'SCF and specialty doctor', accp: 'ACCPs', need: 'Shifts needed', fgh: 'Fairfield', loc: 'Locum rates', pay: 'Pay and on-costs', abs: 'Absence and seasons', lines: 'Work schedule' };
const backName = () => { const prev = path[path.length - 2]; return NAMES[prev] || (GRADES.find(g => g.k === prev) || {}).n || 'Back'; };
const fmtMo = v => num(v) + ' mo', fmtD = v => num(v) + ' d', fmtGbp = v => gbp(v);
const dotsHTML = (posts, fill, lt, color) => { const out = []; const filled = Math.round(posts * fill); for (let i = 0; i < posts; i++) { const vac = i >= filled, half = !vac && i < Math.round(posts * lt); out.push(`<i class="${vac ? 'vac' : half ? 'lt' : ''}" ${color && !vac && !half ? `style="background:${color}"` : ''}></i>`); } return out.join('') || '<span class="lab">None</span>'; };

function lineBlock(owner, kind, page) {
  const g = owner, key = g.line, grid = M.gridFor(S, key), chk = M.checkLine(grid);
  const opts = LINES_FOR[kind] || LINES_FOR.dean, slot = kind === 'core' ? 'custom' : kind === 'accp' ? 'accp' : 'trainee';
  const SHORT = { scf_current: 'Standard', scf_2n: 'Extra nights', sd13: '13 PA', sd10: '10 PA', accp10: 'ACCP 10-week' };
  const nm2 = k => k === slot ? 'Edit days' : SHORT[k] || lineName(k);
  return `<div class="lrows">${opts.map(k => { const c = M.checkLine(M.gridFor(S, k)), on = k === key, ed = k === slot;
      return `<button class="lrow${on ? ' on' : ''}${ed ? ' ed' : ''}" ${ed && on ? `data-go="edit:${slot}:${page}"` : `data-line="${k}" data-owner="${page}"`}>${thumb(M.gridFor(S, k))}<span class="ln">${ed ? ico('pencil', 'sm') : ''}${esc(nm2(k))}</span><span class="lm num">${num(c.hours, 1)} h · ${num(c.pas, 1)} PA</span></button>`; }).join('')}</div>
    ${chk.ok ? '' : `<span class="ok2" style="color:var(--err)">${ico('x', 'sm')}Breaks the 2016 contract</span>`}`;
}

/* ---------- pages ---------- */
function pHome() {
  return head('Inputs') + `<div class="body6">
    <label class="srch">${ico('search', 'sm')}<input id="q" placeholder="Find a setting" value="${esc(query)}" autocomplete="off" aria-label="Find a setting"></label>
    ${query ? searchResults() : `
    <div class="grp6">${row('users', 'Staff', `<span class="num">${num(wteAll(S), 1)} WTE</span>`, 'staff')}${row('grid', 'Work schedule', esc(schedSummary()), 'lines')}${row('target', 'Shifts needed', 'Both sites', 'need')}</div>
    <div class="grp6">${row('hosp', 'Fairfield', (S.core.fghPosts ? S.core.fghPosts + ' in Fairfield team' : 'Salford first'), 'fgh')}${row('userplus', 'Locum rates', 'Bank ' + gbp(S.cost.lr.wdSoc) + ' to ' + gbp(Math.max(S.cost.lr.wdAnti, S.cost.lr.weSoc, S.cost.lr.weAnti)) + ' · ' + Math.round((S.cost.agencyShare || 0) * 100) + '% agency', 'loc')}${row('pound', 'Pay and on-costs', (S.cost.pension ? pct(S.cost.pension) + ' pension' : 'No pension'), 'pay')}${row('thermo', 'Absence and seasons', pc1(S.absence.sick) + ' sick', 'abs')}</div>`}
  </div>`;
}
const pageOf = p => (REG[p] || {}).page || 'home';
const isChanged = page => active.endsWith('*') && changes(baseState()).some(c => pageOf(c.p) === page || (page === 'staff' && ['core', 'accp', ...GRADES.map(g => g.k)].includes(pageOf(c.p))));

      WT.map(t => `<tr><td>${WTN[t]}</td><td>${wn(perShift.srh[t])}</td><td>${wn(W.need.srh[t])}</td><td>${wn(perShift.fgh[t])}</td><td>${wn(W.need.fgh[t])}</td><td>${wn(W.need.srh[t] + W.need.fgh[t])}</td></tr>`).join('') +
      `<tr class="tot"><td>All shifts</td><td></td><td>${wn(wsum(W.need.srh))}</td><td></td><td>${wn(wsum(W.need.fgh))}</td><td>${wn(wsum(W.need.srh) + wsum(W.need.fgh))}</td></tr></tbody>`) +
    `<div class="wkcalc">Salford weekday nights: ${perShift.srh.Nwd} a night (${D.air.N} airway) × ${PERW.Nwd} nights a week × 52 weeks = ${num(W.need.srh.Nwd)}.</div>`);
  // 5 fill
  const fsum = o => wsum(o);
  const s5 = step(5, 'Filling the shifts, in order', '',
    `<ol class="wkol"><li>Fairfield weekday long days from JCFs and ACCS after their first 3 months, and FGH-trained ACCPs.</li><li>Salford airway minimum: trainees first, then SCFs and specialty doctors. Trainee numbers vary from day to day, so trainees only count up to the minimum on each shift.</li><li>Salford everyone else, the same way. Supernumerary SCFs and specialty doctors count here, before signed-off ones.</li><li>Fairfield nights and weekend long days from signed-off SCFs and specialty doctors who aren't needed at Salford, up to ${num(S.core.fghCap * 100)}% of the group's on-calls between them, so some can do more if others do less. A Fairfield team fills Fairfield before step 2.</li><li>Any shift still short is a locum. Anything left over is spare.</li></ol>` +
    tbl(th('Shift', ['Supplied', 'Filled Salford', 'Filled Fairfield', 'Spare', 'Short: locum']) + '<tbody>' +
      WT.map(t => { const sp = ga.reduce((a, g) => a + g.spare[t], 0), gp = W.gap.srh[t] + W.gap.fgh[t]; return `<tr><td>${WTN[t]}</td><td>${wn(sup[t])}</td><td>${wn(W.filled.srh[t])}</td><td>${wn(W.filled.fgh[t])}</td><td>${wn(sp)}</td><td class="${gp >= 0.5 ? 'gap' : ''}">${wn(gp)}</td></tr>`; }).join('') +
      `<tr class="tot"><td>All shifts</td><td>${wn(fsum(sup))}</td><td>${wn(fsum(W.filled.srh))}</td><td>${wn(fsum(W.filled.fgh))}</td><td>${wn(ga.reduce((a, g) => a + fsum(g.spare), 0))}</td><td>${wn(fsum(W.gap.srh) + fsum(W.gap.fgh))}</td></tr></tbody>`) +
    tbl(th('Who fills what', ['Salford', 'Fairfield', 'Spare nights and weekend long days', 'Spare days', 'Total']) + '<tbody>' + ga.map(g => `<tr><td>${esc(g.label)}</td><td>${wn(fsum(g.srh))}</td><td>${wn(fsum(g.fgh))}</td><td>${wn(wsum(g.spare, ONC))}</td><td>${wn(fsum(g.spare) - wsum(g.spare, ONC))}</td><td>${wn(fsum(g.supply))}</td></tr>`).join('') + '</tbody>') +
    `<p>Spare days are people at Salford above the minimum: teaching and training time. Spare nights and weekend long days belong to trainees and ACCPs, who can't work Fairfield on-calls, or are extras on busy nights. That is also why a few Salford shifts are short while others have spare people: trainee numbers vary from night to night, and extras on a busy night can't cover a quiet one.</p>`);

    tbl(th('Shift', ['Short at Salford', 'Short at Fairfield', 'Bank shift' + iI('NHSP rate × the hours in the shift: a night is 11 unsocial hours and 1.5 social.'), 'Agency shift' + iI('Agency rate (a best guess) × the hours in the shift.'), 'Average shift' + iI('What the model uses: bank and agency weighted by the share of locum shifts that go to agency, set on the Locum rates page.'), 'Cost a year']) + '<tbody>' +
      WT.map(t => { const L = W.loc[t], q = shiftCost(S, t); return `<tr><td>${WTN[t]}</td><td>${wn(L.srh)}</td><td>${wn(L.fgh)}</td><td>${gbp(q.bank)}</td><td>${gbp(q.ag)}</td><td>${gbp(q.avg)}</td><td>${gbp(L.cost)}</td></tr>`; }).join('') +

    (q => `<div class="wkcalc">A weekday night: bank ${q.howB} = ${gbp(q.bank)}. Agency ${q.howA} = ${gbp(q.ag)}. ${num(q.sh * 100)}% agency, so on average ${gbp(q.avg)}.</div><div class="wkcalc">Fairfield weekday nights: ${num(W.loc.Nwd.fgh)} × ${gbp(q.avg)} = ${gbp(W.loc.Nwd.fgh * q.avg)}.</div>`)(shiftCost(S, 'Nwd')) + finQ(W.locum));
  // 7 total
  const s7 = step(7, 'Cost of the year', '',

  // 8 one more post
  const O = oneMore(S), pn = O.k === 'sd' ? 'specialty doctor' : 'SCF';
  const cur = G[O.k].posts, lo = Math.max(0, cur - 6), hi = cur + 12, bars = [];
  let prev = null; for (let n = lo; n <= hi; n++) { const s3x = clone(S); s3x.groups[O.k].posts = n; const w = M2.workings(s3x); if (prev) bars.push({ n, net: ((w.staff - prev.staff) - (prev.locum - w.locum)) / O.f, save: (prev.locum - w.locum) / O.f, cost: (w.staff - prev.staff) / O.f }); prev = w; }
  const mx = Math.max(...bars.map(b => b.cost)) * 1.05, bw = 100 / bars.length;
  const chart = `<div class="wkch"><svg viewBox="0 0 960 200" role="img" aria-label="Net cost of each extra post">${bars.map((b, i) => { const x = i * 960 / bars.length + 3, w = 960 / bars.length - 6, hC = b.cost / mx * 150, hS = b.save / mx * 150; return `<g><rect x="${x}" y="${160 - hC}" width="${w}" height="${hC - hS}" rx="3" fill="${b.n === cur + 1 ? 'var(--err)' : 'var(--gap)'}"/><rect x="${x}" y="${160 - hS}" width="${w}" height="${hS}" rx="3" fill="var(--ok)" opacity=".8"/><text x="${x + w / 2}" y="180" text-anchor="middle" font-size="11" fill="currentColor">${b.n}</text><text x="${x + w / 2}" y="${155 - hC}" text-anchor="middle" font-size="11" fill="currentColor">${gbp(b.net)}</text></g>`; }).join('')}</svg></div>
    <div class="kl"><div><i style="background:var(--ok)"></i>Locums it saves</div><div><i style="background:var(--gap)"></i>Net extra cost of that post</div><div><i style="background:var(--err)"></i>The next post from here</div></div>`;
  const s8 = step(8, `One more ${pn} in post`, `The same year worked again with one more ${pn}. A post is paid only while someone is in it: between people it costs nothing and saves nothing. So these figures are for one ${pn} in post. Only the shifts that land on a shift that was short save a locum.`,
    tbl(th('Shift', ['Extra shifts worked', 'Were short: locum saved', 'Already covered: spare', 'Locum saving']) + '<tbody>' +
      WT.map(t => `<tr><td>${WTN[t]}</td><td>${wn(O.by[t].sup)}</td><td>${wn(O.by[t].closed)}</td><td>${wn(O.by[t].spare)}</td><td>${gbp(O.by[t].saved)}</td></tr>`).join('') +
      `<tr class="tot"><td>All shifts</td><td>${wn(O.sup)}</td><td>${wn(O.closed)}</td><td>${wn(Math.max(0, O.sup - O.closed))}</td><td>${gbp(O.save)}</td></tr></tbody>`) +
    `<div class="wkcalc wkbig">Costs ${gbp(O.cost)} − saves ${gbp(O.save)} = <b>${O.net >= 0 ? '+' : '−'}${gbp(Math.abs(O.net))} a year</b></div>
    <p>A full-time ${pn} works ${num(wsum(W.groups[O.k].final))} shifts a year after leave and sickness. On the rota that averages ${num(O.sup)} across their time in post, because for the first ${G[O.k].supernum} months they count only as non-airway at Salford and, until signed off for Fairfield at ${G[O.k].signoff} months, ${num(S.core.fghTrain * 100)}% of their weekdays are training at Fairfield. Day shifts never save a locum: weekday days already run above the minimum at Salford, and Fairfield weekday days are covered. A post saves money only through its nights and weekend long days.</p>

    <p>Each bar is the full cost of adding that post, split into what it saves in locums and what is left over. While there are short nights and weekends it can reach, every post saves about the same. Once Fairfield weekday nights are full, extra weekday nights go spare and each post saves less.</p>`);
  box.innerHTML = s1 + s2 + s3 + s4 + s5 + s6 + s7 + s8;
}

const UNC = [
  { n: 'Locum rates 10% lower to 25% higher', lo: x => scaleLr(x, 0.9), hi: x => scaleLr(x, 1.25) },
  { n: 'Agency share 9% to 21% of locum shifts', lo: x => { x.cost.agencyShare = (x.cost.agencyShare || 0) * 9 / 14; }, hi: x => { x.cost.agencyShare = Math.min(1, (x.cost.agencyShare || 0) * 21 / 14); } },
  { n: 'Lumpiness 10% to 25%', lo: x => { if (lumpOf(x)) x.core.lumpy = Math.max(0.001, lumpOf(x) - 0.075); }, hi: x => { if (lumpOf(x)) x.core.lumpy = lumpOf(x) + 0.075; } },
  { n: 'Sickness 2% to 5%', lo: x => { x.absence.sick *= 2 / 3; }, hi: x => { x.absence.sick *= 5 / 3; } },
  { n: 'Bank add-ons from no NHSP fee to bank work being pensionable', lo: x => { x.cost.bankFee = 0; }, hi: x => { x.cost.bankPen = 1; } },
  { n: 'Weekday nights moved to days 10% to 20%', lo: x => n2dBy(x, -0.045), hi: x => n2dBy(x, 0.055) }
];
const UR_TIP = 'How sure we are. Each plan is worked out again with the inputs we are least sure of set low and then high: ' + UNC.map(u => u.n.charAt(0).toLowerCase() + u.n.slice(1)).join('; ') + '. The swings are added up on the basis that they will not all go the same way at once (square root of the sum of squares). Both ends are paired with Now worked out the same way.';
const UR = {}; let urQ = [], urBusy = false;
const prepS = x => { M2.syncAccp(x); syncT(x); return x; };
function urNeed(key, s) {
  const id = MODE + '|' + key;

  const rec = { base: null, d: UNC.map(() => [0, 0]), done: false, s: clone(s) }; UR[id] = rec;
  const tasks = [() => { rec.base = M2.workings(prepS(clone(rec.s))).total; }];
  UNC.forEach((u, i) => ['lo', 'hi'].forEach((side, j) => { if (u[side]) tasks.push(() => { const x = clone(rec.s); u[side](x); rec.d[i][j] = M2.workings(prepS(x)).total - rec.base; }); }));
  tasks.push(() => { rec.done = true; renderRanges(); renderCmp(); });
  const jobs = tasks.map(f => ({ f, id, rec }));
  if (key === 'live') { urQ = urQ.filter(j => j.id !== id); urQ.unshift(...jobs); } else urQ.push(...jobs);
  if (!urBusy) { urBusy = true; setTimeout(urStep, 0); }
}
function urStep() {
  const j = urQ.shift(); if (!j) { urBusy = false; return; }
  if (UR[j.id] === j.rec) { try { j.f(); } catch (e) { } }
  setTimeout(urStep, 0);
}
function ensureRanges() {

}
const rss = xs => Math.sqrt(xs.reduce((a, x) => a + x * x, 0));
// swings for a plan's cost, or for its difference from Now when paired

  return { lo: -rss(ds.map(p => Math.min(0, p[0], p[1]))), hi: rss(ds.map(p => Math.max(0, p[0], p[1]))) };
}
const k1 = x => Math.round(x / 1000) * 1000;

renderPanel(); recompute(); setTimeout(statPresets, 30);
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use('db'); if (!db) return;
    const user = await window.claude.use('user');
    const can = user && user.can ? await user.can('data.write') : null;
    canSave = can !== false;
    renderSavebar();
    db.doc('meta/plans').onSnapshot(snap => { if (snap.exists) { const d = snap.data() || {}; if (Array.isArray(d.order)) { planMeta = { order: d.order, names: d.names || {} }; store.set('rm.planMeta', JSON.stringify(planMeta)); if (!planEdit) { renderMap(); renderCmp(); } } } }, () => {});
    db.collection('scenarios').orderBy('createdAt', 'desc').limit(30).onSnapshot(snap => {
      saved = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); statSaved();
    }, () => {});
  } catch (err) { /* the page works without saving */ }
})();
})();

<script>
(() => {
  const app = document.getElementById('app'), bar = document.getElementById('mtabs');
  const mq = window.matchMedia('(max-width: 760px)');
  window.mIsMobile = () => mq.matches;
  window.mTab = (t, top) => {
    app.dataset.tab = t;
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mt === t));
    if (top !== false && mq.matches) window.scrollTo(0, 0);
  };
  bar.addEventListener('click', e => { const b = e.target.closest('[data-mt]'); if (b) window.mTab(b.dataset.mt); });
  window.mTab('plans', false);
  // picking a plan on a phone takes you straight to its results
  document.getElementById('map').addEventListener('click', e => {
    if (!mq.matches) return;
    const t = e.target.closest('button'); if (!t || e.target.closest('[data-costof]')) return;
    if (document.querySelector('#map input[data-rename]')) return;
    if (t.dataset.preset || t.dataset.saved) setTimeout(() => window.mTab('outs'), 60);
  });
  // keep the tab labels in step with the page
  const sync = () => {
    const n = document.getElementById('outName'); document.getElementById('mtPlan').textContent = n ? n.textContent : '';
    const hl = document.getElementById('hl'); const v = hl && hl.querySelector('.big, .v, b');
    const cost = hl ? (hl.textContent.match(/£[\d,]+/) || [''])[0] : '';
    document.getElementById('mtRes').textContent = cost;
  };
  new MutationObserver(sync).observe(document.getElementById('hl'), { childList: true, subtree: true, characterData: true });
  new MutationObserver(sync).observe(document.getElementById('outName'), { childList: true, subtree: true, characterData: true });
  sync();
})();
</script>
