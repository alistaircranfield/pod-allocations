<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>*,*::before,*::after{box-sizing:border-box}:root{color-scheme:light}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>FGH and SRH Rota Model</title>
<style>

/* Layout: a step tracker, then three palette options side by side, each shown on a miniature of the real page. CritCare Ultrasound tokens: SF system type, #1d1d1f ink, #f5f5f7 ground, 16px cards, 11px capital labels, stroke icons. Light only, by choice. */
:root {
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg: #f5f5f7; --surface: #ffffff; --text: #1d1d1f; --text-2: #6e6e73; --text-3: #8a8a8f;
  --border: #e8e8ed; --track: #ececef;
  --ok: #1f8a3a; --ok-wash: #e6f4ea; --err: #b3261e; --err-wash: #fbeae9; --gap: #f2c4c0;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.04);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.45; margin: 0; }
.wrap { padding-inline: 16px; padding-block: 24px 40px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 14px; height: 14px; }
.lab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.num { font-variant-numeric: tabular-nums; }

/* step tracker */
.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.st { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; color: var(--text-3); font-weight: 600; font-size: 12px; }
.st b { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--track); color: var(--text-2); }
.st.on { background: var(--text); color: #fff; }
.st.on b { background: #fff; color: var(--text); }

.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; margin-top: 24px; }
.opt { display: grid; gap: 12px; align-content: start; }
.ohead { display: flex; align-items: center; gap: 10px; }
.ohead .L { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 15px; font-weight: 700; background: var(--acc); color: var(--acc-ink); }
.ohead .n { font-size: 17px; font-weight: 600; }

/* key: one chip per colour role */
.key { display: flex; flex-wrap: wrap; gap: 6px; }
.k { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px 4px 4px; font-size: 12px; color: var(--text-2); }
.k i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.k i.lt { color: var(--text); }

/* miniature page */
.page { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.pr { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--text); }
.pr.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.crow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.seg { display: inline-flex; background: var(--track); border-radius: 10px; padding: 2px; gap: 2px; }
.seg span { width: 28px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); }
.seg span.on { background: var(--surface); color: var(--acc); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.big { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--err-wash); color: var(--err); vertical-align: middle; margin-left: 6px; }
.band { position: relative; height: 6px; background: var(--track); border-radius: 3px; }
.band span { position: absolute; top: 0; bottom: 0; left: 38%; width: 22%; background: var(--acc-wash); border-radius: 3px; }
.band b { position: absolute; top: -3px; left: 48%; width: 3px; height: 12px; border-radius: 2px; background: var(--acc); }
.bar { display: flex; height: 14px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--track); }
.bar span { display: block; height: 100%; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.legend div { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.site { display: grid; grid-template-columns: 26px minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.sico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.site .v { text-align: right; font-weight: 600; }
.line { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.line div { height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--track); }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; text-align: center; font-size: 10px; font-weight: 600; color: var(--text-3); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: grid; gap: 6px; justify-items: start; }
.tile .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--acc-wash); color: var(--acc); }
.tile .tv { font-size: 15px; font-weight: 600; }
.ok { color: var(--ok); }

/* option palettes */
.A { --acc: #3f4756; --acc-ink: #fff; --acc-wash: #eceef1;
     --s: #2563a8; --s-lt: #b7cde8; --f: #138d74; --f-lt: #aedbd1;
     --sub: #3f4756; --loc: #b8bec8; --n: #3f4756; --l: #8b93a1; --d: #d9dce2; --ni: #fff; --li: #fff; --di: #3f4756; }
.B { --acc: #0a84ff; --acc-ink: #fff; --acc-wash: #e6f2ff;
     --s: #1d1d1f; --s-lt: #ff9f0a; --f: #1d1d1f; --f-lt: #ff9f0a;
     --sub: #1d1d1f; --loc: #ff9f0a; --n: #5e5ce6; --l: #ffd60a; --d: #e5e5ea; --ni: #fff; --li: #1d1d1f; --di: #1d1d1f; }
.C { --acc: #1d1d1f; --acc-ink: #fff; --acc-wash: #f0f0f2;
     --s: #0a84ff; --s-lt: #9fcdff; --f: #ff9f0a; --f-lt: #ffd699;
     --sub: #0a84ff; --loc: #ff9f0a; --n: #1d1d1f; --l: #8e8e93; --d: #e5e5ea; --ni: #fff; --li: #fff; --di: #1d1d1f; }
.C .costsub { background: var(--s); } .C .costloc { background: var(--f); }
.costsub { background: var(--sub); } .costloc { background: var(--loc); }
.shN { background: var(--n) !important; color: var(--ni); }
.shL { background: var(--l) !important; color: var(--li); }
.shD { background: var(--d) !important; color: var(--di); }
.sS { background: var(--s); color: #fff; } .sF { background: var(--f); color: #fff; }
.B .sS, .B .sF { background: var(--track); color: var(--text); }
.oS { background: var(--s); } .lS { background: var(--s-lt); }
.oF { background: var(--f); } .lF { background: var(--f-lt); }
.gp { background: var(--gap); }


/* steps as tabs */
.st { border: 0; background: none; cursor: pointer; font: inherit; }
.st.done b { background: var(--A-acc); color: #fff; }
.st:focus-visible { outline: 2px solid var(--A-acc); outline-offset: 2px; }
.step2 { display: grid; gap: 16px; margin-top: 24px; }
.A2 { --acc: #3f4756; --acc-ink: #fff; --acc-wash: #eceef1; --s: #2563a8; --s-lt: #b7cde8; --f: #138d74; --f-lt: #aedbd1; }
.popt { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: grid; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
.popt .ohead .n { font-size: 15px; }
.grp { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.grp > div { display: grid; gap: 6px; }
.grp .row { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 7px 11px; font-size: 13px; font-weight: 600; color: var(--text); }
.pill.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.pill.add { border-style: dashed; color: var(--text-2); }
.pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: grid; gap: 6px; width: 148px; }
.pcard.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
.pcard .t { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; }
.pcard .ic { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--acc-wash); color: var(--acc); flex: none; }
.pcard.on .ic { background: var(--acc); color: #fff; }
.pcard .c { font-size: 14px; font-weight: 700; }
.mini { display: grid; grid-template-columns: 12px minmax(0,1fr); gap: 3px 6px; align-items: center; font-size: 10px; font-weight: 700; color: var(--text-3); }
.mini .mb { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
.mini .mb span { display: block; height: 100%; }
.map { overflow-x: auto; }
.map > svg { display: block; width: 100%; min-width: 620px; height: auto; }
.segc { display: inline-flex; background: var(--track); border-radius: 12px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.segc span { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--text-2); }
.segc span.on { background: var(--surface); color: var(--acc); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.drawer { border-top: 1px solid var(--border); padding-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.rec { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ok); background: var(--ok-wash); padding: 3px 8px; border-radius: 999px; }
:root { --A-acc: #3f4756; }

/* step 5: inputs by grade */
.step5 { display: grid; gap: 16px; margin-top: 24px; --acc: #3f4756; --acc-ink: #fff; --acc-wash: #eceef1; --s: #2563a8; --f: #138d74; }
.sect { display: flex; align-items: center; gap: 10px; }
.sect .n { font-size: 15px; font-weight: 600; }
.sect .L { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; flex: none; }
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.gcard { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.gcard.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
.gcard .top { display: flex; align-items: center; gap: 8px; }
.gcard .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--acc-wash); color: var(--acc); flex: none; }
.gcard .nm { font-weight: 600; font-size: 13px; line-height: 1.2; }
.gcard .w { margin-left: auto; text-align: right; }
.gcard .w b { display: block; font-size: 17px; }
.dots { display: flex; flex-wrap: wrap; gap: 3px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); }
.dots i.lt { background: linear-gradient(90deg, var(--acc) 0 60%, var(--track) 60% 100%); }
.dots i.vac { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }
.dots i.sd { background: var(--s); }
.can { display: flex; gap: 4px; flex-wrap: wrap; }
.can span { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--track); color: var(--text-3); }
.can span.y { background: var(--acc); color: #fff; }
.can span.f { background: var(--f); color: #fff; }
.thumb { display: grid; gap: 2px; }
.thumb div { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 2px; }
.thumb i { height: 5px; }
.thumb i { display: block; border-radius: 1px; background: var(--track); }
.thumb i.N { background: #3f4756; } .thumb i.L { background: #8b93a1; } .thumb i.S { background: #d0d4db; }
.detail { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 16px; }
.dhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dhead .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--acc); color: #fff; }
.dhead .nm { font-size: 17px; font-weight: 600; }
.dhead .wte { margin-left: auto; display: flex; gap: 16px; }
.dhead .wte div { text-align: right; } .dhead .wte b { display: block; font-size: 22px; }
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.blk { border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: grid; gap: 10px; align-content: start; }
.blk .bh { display: flex; align-items: center; gap: 6px; }
.row2 { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 8px; align-items: center; }
.row2 .ri { color: var(--text-2); display: grid; place-items: center; }
.row2 .rl { font-size: 13px; }
.stp { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; }
.stp span { width: 26px; text-align: center; color: var(--text-2); font-size: 15px; }
.stp b { min-width: 52px; text-align: center; font-weight: 600; font-size: 13px; }
.sl { grid-column: 2 / -1; height: 6px; border-radius: 3px; background: var(--track); position: relative; }
.sl span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--acc); }
.sl b { position: absolute; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px var(--acc), 0 1px 3px rgba(0,0,0,.15); margin-left: -8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-2); }
.chip.y { background: var(--acc); border-color: var(--acc); color: #fff; }
.chip.f.y { background: var(--f); border-color: var(--f); }
.chip.s.y { background: var(--s); border-color: var(--s); }
.lines { display: flex; gap: 8px; flex-wrap: wrap; }
.lpick { border: 1px solid var(--border); border-radius: 10px; padding: 8px; display: grid; gap: 6px; width: 132px; }
.lpick.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
.lpick .ln { font-size: 11px; font-weight: 600; }
.ok2 { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }
.conv { display: grid; gap: 10px; }
.conv .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.newtag { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ok); background: var(--ok-wash); border-radius: 999px; padding: 2px 6px; }

.ov { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.ovt { border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: grid; gap: 10px; align-content: start; background: var(--surface); }
.ovt .top { display: flex; align-items: center; gap: 8px; }
.ovt .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--acc); color: #fff; }
.ovt .nm { font-weight: 600; }
.ovt .ct { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--text-3); }
.need { overflow-x: auto; }
.need table { border-collapse: separate; border-spacing: 6px; min-width: 560px; }
.need th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); text-align: center; padding: 0 4px; }
.need th.r { text-align: left; }
.need td.rh { white-space: nowrap; font-weight: 600; font-size: 13px; }
.need td.rh span { display: inline-flex; align-items: center; gap: 6px; }
.cell { border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; display: grid; gap: 4px; justify-items: center; }
.cell .mt { display: flex; align-items: center; gap: 6px; }
.cell .mt b { font-size: 15px; } .cell .mt em { font-style: normal; font-size: 12px; color: var(--text-3); }
.cell .pp { display: flex; gap: 2px; }
.cell .pp i { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
.cell .pp i.t { background: transparent; box-shadow: inset 0 0 0 1.5px var(--acc); }
.cell.na { border-style: dashed; color: var(--text-3); }
.rates { overflow-x: auto; }
.rates table { border-collapse: separate; border-spacing: 6px; min-width: 520px; }
.rates td, .rates th { text-align: center; }
.rates th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.rate { border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; font-weight: 600; }
.rate.z { color: var(--text-3); border-style: dashed; }

/* step 6: side panel options */
.step6 { display: grid; gap: 16px; margin-top: 24px; --acc: #3f4756; --acc-ink: #fff; --acc-wash: #eceef1; --s: #2563a8; --f: #138d74; --sep: #e5e5ea; --g2: #f2f2f7; }
.s6grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; }
@media (max-width: 460px) { .s6grid { grid-template-columns: minmax(0, 1fr); } }
.s6 { display: grid; gap: 8px; align-content: start; min-width: 0; }
.s6 .cap6 { display: flex; align-items: center; gap: 8px; }
.s6 .cap6 .L { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--acc); color: #fff; font-weight: 700; font-size: 12px; flex: none; }
.s6 .cap6 .n { font-weight: 600; font-size: 14px; }
.s6 .cap6 .rec { margin-left: auto; }
.pane { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); height: 600px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
.nav { display: flex; align-items: center; gap: 6px; padding: 12px 14px 4px; color: var(--acc); font-size: 13px; font-weight: 500; }
.nav .t { margin-left: auto; margin-right: auto; color: var(--text); font-weight: 600; }
.lt { font-size: 24px; font-weight: 700; letter-spacing: -.02em; padding: 2px 16px 8px; }
.body6 { padding: 0 12px 12px; overflow: hidden; display: grid; gap: 14px; align-content: start; }
.gh { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); padding: 0 6px 6px; }
.grp6 { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.r6 { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; min-height: 42px; position: relative; }
.r6 + .r6::before { content: ""; position: absolute; top: 0; left: 48px; right: 0; height: 1px; background: var(--sep); }
.r6 .ib { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--acc); color: #fff; }
.r6 .ib.lt2 { background: var(--acc-wash); color: var(--acc); }
.r6 .l { font-size: 14px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.r6 .v { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 14px; }
.r6 .v svg.ch { width: 13px; height: 13px; color: var(--text-3); }
.ii { color: var(--text-3); display: inline-grid; place-items: center; }
.ii svg { width: 14px; height: 14px; }
.ii.on { color: var(--acc); }
.tip { position: absolute; z-index: 3; background: #1d1d1f; color: #fff; font-size: 12px; line-height: 1.35; padding: 8px 10px; border-radius: 10px; max-width: 220px; box-shadow: var(--shadow-overlay, 0 12px 32px rgba(0,0,0,.18)); }
.tip::after { content: ""; position: absolute; top: -5px; left: var(--ax, 20px); width: 10px; height: 10px; background: #1d1d1f; transform: rotate(45deg); }
.mst { display: inline-flex; align-items: center; background: var(--g2); border-radius: 8px; }
.mst span { width: 28px; height: 26px; display: grid; place-items: center; color: var(--text); font-size: 15px; }

/* FGH and SRH resident workforce model: engine. Pure functions, no DOM. */
(function (root) {
'use strict';

const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const SH = { S: { s: 8, e: 16, h: 8 }, L: { s: 8, e: 20.5, h: 12.5 }, N: { s: 20, e: 32.5, h: 12.5 } };
const TYPES = ['Nwe', 'Lwe', 'Nwd', 'Lwd', 'Swd', 'Swe'];
const TYPE_HOURS = { Nwe: 12.5, Lwe: 12.5, Nwd: 12.5, Lwd: 12.5, Swd: 8, Swe: 8 };
const TYPE_LABEL = { Nwd: 'Weekday night', Nwe: 'Weekend night', Lwd: 'Weekday long day', Lwe: 'Weekend long day', Swd: 'Weekday short day', Swe: 'Weekend short day' };
// shifts of each type in a week of demand at 1 per day
const PER_WEEK = { Nwd: 4, Nwe: 3, Lwd: 5, Lwe: 2, Swd: 5, Swe: 2 };

/* ---------- rota lines ---------- */
const LINES = {
  scf_current: { name: '9-week template', note: 'The SCO ICU 100% rota template, 2026: the generic work schedule everyone works now. About 12.8 PA for a specialty doctor',
    grid: ['NN..L..', 'SLSL.LS', '.SNN...', 'LSLSL..', 'LSS.NNN', '..SSS..', 'SSSSS..', 'SLS.LSL', 'S.NN...'] },
  sd_10pa: { name: 'Specialty doctor 10 PA', note: 'All nights and long days of the current line, 6 short days',
    grid: ['NN..L..', '.L.L.LS', '.SNN...', 'LSL.L..', 'L...NNN', '..S....', '.S.....', '.LS.LSL', 'S.NN...'] },

    grid: ['NN..L..', '.L.L.LL', '.SNN...', 'LSL.L..', 'L...NNN', '..S....', '.S.....', '.LS.LLL', 'S.NN...'] },
  scf_actual: { name: 'Now, as actually worked', note: 'SCF shift mix from Allocate, Sep 2025 to Aug 2026: more nights, fewer short days than the template',
    grid: ['NN..L..', 'SLSL.LS', '.SNN...', 'LSLSL..', 'LSS.NNN', '..SSS..', 'NNN....', 'SLS.LSL', 'S.NN...'] },
  sd_2wn: { name: 'Proposed: two night weekends', note: 'Two of the three weekends are night blocks, for FGH weekend nights',
    grid: ['NN..L..', '.L.L.LL', '.S.S...', 'LSL.L..', 'L...NNN', '..S.S..', '.S.S...', 'L.L.NNN', '..S.L..'] },
  sd_same: { name: '9-week on-calls, no short days', note: 'The SCF line as actually worked, with every short day removed: all 12 nights and 11 long days per 9 weeks, 9.6 PA',
    grid: ['NN..L..', '.L.L.L.', '..NN...', 'L.L.L..', 'L...NNN', '.......', 'NNN....', '.L..L.L', '..NN...'] },
  accp10: { name: 'ACCP 10-week', note: 'Agenda for Change, about 37 hours a week. Built so 14 ACCPs give about one on every Salford night and one to two on every day, as they work now',
    grid: ['NNNN...', 'L.S.L..', 'S.L..LL', 'LS.L...', 'S.L.S..', 'L...NNN', '..L.L..', 'S.L.S..', 'L.S..LL', 'SL.S...'] },
  fgh6: { name: '6-week Fairfield line', note: 'For SCFs who cover Fairfield: 2 weekends in 6, both on call (a Friday to Sunday night set and a weekend of long days), no weekend short days. Same 1 in 3 weekends, 50% more weekend nights and long days than the 9-week template',
    grid: ['SLS.NNN', '..LSL..', 'NNNN...', 'SLS..LL', 'L.SLS..', 'SLS....'] },
  scf_2n: { name: '9-week template, two extra weekday night sets', note: 'Suggestion: the 9-week template with a Wednesday to Thursday night set in week 6 and a Monday to Tuesday set in week 7 in place of standard days. Weekends unchanged',
    grid: ['NN..L..', 'SLSL.LS', '.SNN...', 'LSLSL..', 'LSS.NNN', '..NN...', 'NN..S..', 'SLS.LSL', 'S.NN...'] },
  sd13: { name: '9-week template, 13 PA', note: 'For specialty doctors: the 9-week template with one more weekday standard day, 13 PA',
    grid: ['NN..L..', 'SLSL.LS', 'SSNN...', 'LSLSL..', 'LSS.NNN', '..SSS..', 'SSSSS..', 'SLS.LSL', 'S.NN...'] },
  sd10: { name: '9-week template, 10 PA', note: 'For specialty doctors: every night and weekend shift of the 9-week template kept, 12 weekday short days dropped',
    grid: ['NN..L..', '.L.L.LS', '.SNN...', 'L.L.L..', 'LS..NNN', '..S....', 'S.S....', '.LS.LSL', '..NN...'] },
  ltft80: { name: 'Part-time 80%', note: 'SCO ICU part-time 80% rota template, 2026', hidden: true,
    grid: ['NN..S..',  '.LS..LS',  '..NN...',  'SS.LL..',  'SSS.NNN',  '..LSS..',  'SS.S...',  'SL..L.S',  'L.L....'] },
  ltft70: { name: 'Part-time 70%', note: 'SCO ICU part-time 70% rota template, 2026', hidden: true,
    grid: ['NN..S..',  '..S..LS',  '..NN...',  'SS.LL..',  'LSS.NNN',  '..SS...',  'SS.S...',  'S..SL.S',  'L.L....'] },
  ltft60: { name: 'Part-time 60%', note: 'SCO ICU part-time 60% rota template, 2026', hidden: true,
    grid: ['S.S.L.L',  '..S.S..',  'NN.....',  'S...NNN',  '...SS..',  'L.S..L.',  'L.L....',  'S.S.S..',  'S...S..'] },
  ltft50: { name: 'Part-time 50%', note: 'SCO ICU part-time 50% rota template, 2026', hidden: true,
    grid: ['NN..S..',  '.LS..LS',  '.......',  '.S.SL..',  '.SS..LL',  '..S.S..',  'S......',  '...LL..',  'S.S....'] },
  two_nw: { name: 'Two night weekends', note: 'The 9-week template with two of the three worked weekends as Friday to Sunday nights and the third as two long days; fewer weekday short days',
    grid: ['NN..L..', 'SL..NNN', '..NN...', 'LSLS...', 'LSS.NNN', '..SS...', 'NNN....', 'SLS.LLL', 'S.NN...'] },
  two_nw_pa: { name: 'Two night weekends, 10 PA', note: 'Two night weekends for specialty doctors: no short days, about 10 PA',
    grid: ['NN..L..', '.L..NNN', '..NN...', 'L...L..', 'L...NNN', '.......', 'NNN....', '.L..LLL', '..NN...'] },
  sd_eff6: { name: 'Proposed: 6-week, full weekends', note: 'Each worked weekend is Friday to Sunday nights or Saturday and Sunday long days; one Monday to Thursday night block',
    grid: ['....NNN', '..L.L..', 'NNNN...', '..SL...', 'L.S..LL', '.L.S...'] },
  prop6: { name: 'Proposal 6-week line', note: 'FGH tier proposal, 6 SCFs, 1 in 3 weekends',
    grid: ['NN..S..', 'SSNN...', 'SS..NNN', '..LL...', 'SSSSS..', 'LL..LLL'] },
  prop9: { name: 'Proposal 9-week line', note: 'FGH tier proposal, 9 SCFs, 1 in 3 weekends',
    grid: ['NN..S..', 'SLSL.LL', '..NN...', 'LSLSL..', 'LSS.NNN', '..SSS..', 'SSSSS..', 'SLS.LSS', 'S.NN...'] }
};

function lineCounts(grid, extraSD) {
  const c = { Nwd: 0, Nwe: 0, Lwd: 0, Lwe: 0, Swd: 0, Swe: 0 };
  grid.forEach(row => [...row].forEach((ch, d) => {
    if (ch === 'N') c[d >= 4 ? 'Nwe' : 'Nwd']++;
    else if (ch === 'L') c[d >= 5 ? 'Lwe' : 'Lwd']++;
    else if (ch === 'S') c[d >= 5 ? 'Swe' : 'Swd']++;
  }));
  c.Swd += extraSD || 0;
  return c;
}

function shiftsOf(grid) {
  const out = [];
  grid.forEach((row, w) => [...row].forEach((ch, d) => {
    if (SH[ch]) { const b = (w * 7 + d) * 24; out.push({ t: ch, s: b + SH[ch].s, e: b + SH[ch].e, w, d }); }
  }));
  return out;
}

function lineHours(grid, extraSD) {
  const cw = grid.length; let h = 0;
  shiftsOf(grid).forEach(s => h += s.e - s.s);
  return (h + 8 * (extraSD || 0)) / cw;
}

// PAs per week: weekday 07:00-19:00 = 4h per PA, any other time = 3h per PA
function linePAs(grid, extraSD) {
  let pa = 0;
  shiftsOf(grid).forEach(s => {
    for (let t = s.s; t < s.e; t += 0.25) {
      const day = Math.floor(t / 24) % 7, hr = t % 24;
      const inHours = day < 5 && hr >= 7 && hr < 19;
      pa += 0.25 / (inHours ? 4 : 3);
    }
  });
  pa += (extraSD || 0) * 2;
  return pa / grid.length;
}

/* contract checks: 2016 resident doctor TCS, with the weekend cap set by the service */
function checkLine(grid, opts) {
  const o = Object.assign({ weekendCap: 3, extraSD: 0 }, opts || {});
  const cw = grid.length, span = cw * 168, sh = shiftsOf(grid).sort((a, b) => a.s - b.s);
  const res = [];
  const n = sh.length;
  // weekends
  let we = 0;
  for (let w = 0; w < cw; w++) {
    const a = (w * 7 + 5) * 24, b = a + 48;
    if (sh.some(s => [0, -span].some(off => s.s + off < b && s.e + off > a))) we++;
  }
  const freq = we / cw;
  res.push({ k: 'weekends', label: 'Weekends', ok: freq <= 1 / o.weekendCap + 1e-9, val: we + ' in ' + cw, need: '1 in ' + o.weekendCap + ' or less' });
  // average hours
  const avg = lineHours(grid, o.extraSD);
  res.push({ k: 'avg', label: 'Average hours', ok: avg <= 48 + 1e-9, val: avg.toFixed(1) + ' h', need: '48 or less' });
  // 72 h in any 168
  let max72 = 0;
  const ext = sh.concat(sh.map(s => ({ ...s, s: s.s + span, e: s.e + span })));
  for (const a of ext) {
    const st = a.s, en = st + 168; let h = 0;
    for (const b of ext) h += Math.max(0, Math.min(b.e, en) - Math.max(b.s, st));
    if (st < span) max72 = Math.max(max72, h);
  }
  res.push({ k: 'h168', label: 'Hours in any 7 days', ok: max72 <= 72 + 1e-9, val: max72.toFixed(1) + ' h', need: '72 or less' });
  // consecutive runs on consecutive days (circular)
  const byDay = new Array(cw * 7).fill(null);
  sh.forEach(s => byDay[s.w * 7 + s.d] = s.t);
  function maxRun(pred) {
    let best = 0;
    for (let i = 0; i < byDay.length; i++) {
      if (!pred(byDay[i]) || pred(byDay[(i - 1 + byDay.length) % byDay.length])) continue;
      let k = 0; while (k < byDay.length && pred(byDay[(i + k) % byDay.length])) k++;
      best = Math.max(best, k);
    }
    if (best === 0 && byDay.every(pred)) best = byDay.length;
    return best;
  }
  const rn = maxRun(x => x === 'N'), rl = maxRun(x => x === 'N' || x === 'L'), ra = maxRun(x => !!x);
  res.push({ k: 'nights', label: 'Nights in a row', ok: rn <= 4, val: String(rn), need: '4 or fewer' });
  res.push({ k: 'long', label: 'Long shifts in a row', ok: rl <= 4, val: String(rl), need: '4 or fewer' });
  res.push({ k: 'run', label: 'Shifts in a row', ok: ra <= 7, val: String(ra), need: '7 or fewer' });
  // rest
  let minRest = 1e9, nightRest = 1e9, longRest = 1e9;
  for (let i = 0; i < n; i++) {
    const a = sh[i], b = i + 1 < n ? sh[i + 1] : { ...sh[0], s: sh[0].s + span };
    const gap = b.s - a.e;
    minRest = Math.min(minRest, gap);
    if (a.t === 'N' && b.t !== 'N') nightRest = Math.min(nightRest, gap);
  }
  res.push({ k: 'rest', label: 'Rest between shifts', ok: minRest >= 11 - 1e-9, val: minRest.toFixed(1) + ' h', need: '11 or more' });
  res.push({ k: 'nrest', label: 'Rest after nights', ok: nightRest >= 46 - 1e-9, val: (nightRest > 1e8 ? 'none' : nightRest.toFixed(1) + ' h'), need: '46 or more' });
  return { ok: res.every(r => r.ok), items: res, hours: avg, pas: linePAs(grid, o.extraSD), weekends: freq };
}

/* ---------- staffing baselines from the workforce deck (WTE in post) ---------- */
const TREND = {
  months: ['Feb-25', 'May-25', 'Aug-25', 'Nov-25', 'Feb-26', 'May-26', 'Aug-26'],
  icm: [8.4, 9.4, 8.2, 7.8, 10.6, 7.6, 9.4], anaes: [2.6, 3, 1.8, 2.6, 3, 3, 3], imt: [4, 4, 4, 3.6, 5, 4, 4],
  fy2: [4, 4, 4, 4, 4, 4, 4], accs: [3, 3, 3.8, 3.8, 3, 3, 2], scf: [5.6, 6.4, 7.4, 7.8, 8.8, 9.8, 8.8], jcf: [4, 4, 4, 4, 4, 4, 4]
};
const POSTS = { icm: 10, anaes: 3, imt: 4, fy2: 4, accs: 4, jcf: 4 };
function baselineFill(which) {
  const out = {};
  Object.keys(POSTS).forEach(k => {
    const a = TREND[k]; let v;
    if (which === 'aug26') v = a[a.length - 1];
    else if (which === 'low') v = Math.min(...a);
    else v = a.reduce((x, y) => x + y, 0) / a.length;
    out[k] = Math.min(1.25, v / POSTS[k]);
  });
  return out;
}

/* ---------- default scenario ---------- */
function defaultScenario(kind) {
  const f = baselineFill('aug26');
  const g = (o) => Object.assign({ posts: 0, fill: 1, ltft: 1, sick: 0.04, noNights: 0, al: 27, bh: 8, study: 10, spa: 0, line: 'scf_current' }, o);
  const s = {
    name: 'Today',
    weekendCap: 3,
    groups: {
      scf: g({ label: 'SCF', tier: 'core', posts: 9, newPosts: 0, al: 32, study: 10, line: 'scf_current' }),
      sd: g({ label: 'Specialty doctor', tier: 'core', posts: 0, newPosts: 0, al: 32, study: 0, spa: 12, line: 'sd_10pa', extraPA: 0 }),
      icm1: g({ label: 'ICM stage 1', tier: 'air', posts: 3, fill: f.icm, fgh: false }),
      icm2: g({ label: 'ICM stage 2', tier: 'air', posts: 4, fill: f.icm, fgh: false }),
      icm3: g({ label: 'ICM stage 3 (ST7+)', tier: 'air', posts: 3, fill: f.icm, fgh: false, actingUp: 2 }),
      anaes: g({ label: 'Anaesthesia', tier: 'air', posts: 3, fill: f.anaes }),
      accpSr: g({ label: 'ACCP, transfer and FGH', tier: 'na', posts: 3, ltft: 0.75, al: 29, study: 5, line: 'scf_current' }),
      accp: g({ label: 'ACCP, other', tier: 'na', posts: 7, ltft: 0.75, al: 29, study: 5, line: 'scf_current' }),
      accpAir: g({ label: 'ACCP, advanced airway', tier: 'na', posts: 0, ltft: 0.75, al: 29, study: 5, line: 'scf_current' }),
      jcf: g({ label: 'JCF', tier: 'na', posts: 4, fill: f.jcf, fgh: true, rotation: 12, leadIn: 3, al: 27, study: 5 }),
      accs: g({ label: 'ACCS', tier: 'na', posts: 4, fill: f.accs, fgh: true, rotation: 6, leadIn: 2 }),
      imt: g({ label: 'IMT', tier: 'na', posts: 4, fill: f.imt }),
      fy2: g({ label: 'FY2', tier: 'na', posts: 4, fill: f.fy2 }),
      other: g({ label: 'ED, neuro, renal, RCF', tier: 'na', posts: 2, study: 5 })
    },
    core: {
      stay: { scf: 30, sd: 30 }, vacancy: 4, supernum: 3, signoff: 6, extPlacement: 0,
      fghMode: 'auto', fghShare: 0.35, fghCap: 0.5, structure: 'blocks', weekendFghOthers: false, priority: 'fgh', fghAnaes: 0, fghDayShare: 0
    },
    demand: {
      fgh: { L: 1, N: 1 }, fghT: { L: 1, N: 1 },
      air: { Lwd: 2, Swd: 2, Lwe: 2, Swe: 1, N: 1 }, airT: { Lwd: 2, Swd: 2, Lwe: 2, Swe: 1, N: 2 },
      na: { Lwd: 3, Swd: 3, Lwe: 3, Swe: 2, N: 4 }, naT: { Lwd: 3, Swd: 3, Lwe: 3, Swe: 2, N: 4 }
    },
    cost: {
      scfPay: 90000, sdPay: 73383, ni: 0.15, niThreshold: 5000, pension: 0.1438,
      rate: { Lwd: 80, Nwd: 80, Lwe: 80, Nwe: 80, Swd: 80, Swe: 80 }, naRate: 80, locumTo: 'min', locumFill: 1, locumScope: 'airway', anaesNight: 0
    },
    lines: { trainee: LINES.scf_current.grid.slice(), accp: LINES.accp10.grid.slice(), custom: LINES.scf_current.grid.slice() },
    baseline: 'aug26'
  };
  if (kind === 'sd9') {
    s.name = '9 specialty doctors, 10 PA';
    s.groups.scf.posts = 0; s.groups.sd.posts = 9;
  } else if (kind === 'sd12') {
    s.name = '12 specialty doctors, 10 PA';
    s.groups.scf.posts = 0; s.groups.sd.posts = 9; s.groups.sd.newPosts = 3;
  }
  return s;
}

function gridFor(s, key) {
  if (LINES[key]) return LINES[key].grid;
  return s.lines[key] || LINES.scf_current.grid;
}

/* ---------- supply ---------- */
function availability(gr, core, isCore) {
  let a = 1 - (gr.al + gr.bh + gr.study) / 260 - gr.sick;
  if (isCore) a -= (core.extPlacement || 0) / 12;
  return Math.max(0, a);
}

// per-person-per-week shifts of each type, before people counts
function perPerson(s, key) {
  const gr = s.groups[key];
  const extra = key === 'sd' ? (gr.extraPA || 0) * 9 / 2 : 0;
  const grid = gridFor(s, gr.line);
  const cw = grid.length, c = lineCounts(grid, extra), out = {};
  TYPES.forEach(t => out[t] = c[t] / cw);
  if (gr.spa) out.Swd = Math.max(0, out.Swd - gr.spa / 52);
  // no-nights restriction: nights become long days
  if (gr.noNights) {
    out.Lwd += out.Nwd * gr.noNights; out.Lwe += out.Nwe * gr.noNights;
    out.Nwd *= 1 - gr.noNights; out.Nwe *= 1 - gr.noNights;
  }
  if (gr.actingUp) out.Nwd = Math.max(0, out.Nwd - gr.actingUp / 9);
  const av = availability(gr, s.core, gr.tier === 'core');
  TYPES.forEach(t => out[t] *= av);
  return out;
}

// steady-state pipeline fractions for SCF / specialty doctor posts
function pipeline(core, stay) {
  const T = Math.max(stay, core.signoff + 0.01), v = core.vacancy, C = T + v;
  return { vacant: v / C, super: Math.min(core.supernum, T) / C, srhOnly: Math.max(0, core.signoff - core.supernum) / C,
    full: Math.max(0, T - core.signoff) / C, paid: T / C };
}

/* ---------- allocation ---------- */
function allocate(s, coreState) {
  // coreState: for scf and sd: { full, srhOnly, super, paid } in people (WTE before ltft)
  const G = s.groups, core = s.core, pools = [];
  const add = (id, g, heads, el) => {
    if (heads <= 0) return;
    const pp = perPerson(s, g), amt = {};
    TYPES.forEach(t => amt[t] = pp[t] * heads);
    pools.push({ id, g, amt, used: Object.fromEntries(TYPES.map(t => [t, {}])), el });
  };
  // core groups
  ['scf', 'sd'].forEach(k => {
    const cs = coreState[k], lt = G[k].ltft;
    add(k + 'Full', k, cs.full * lt, { fgh: true, air: true, airS: true, na: true });
    let srh = cs.srhOnly * lt;
    add(k + 'Srh', k, srh, { air: true, airS: true, na: true, mixedLoss: core.structure === 'mixed' });
  });
  ['icm1', 'icm2', 'icm3'].forEach(k => add(k, k, G[k].posts * G[k].fill * G[k].ltft, { air: true, airS: true, na: true, fghL: !!G[k].fgh }));
  add('anaes', 'anaes', G.anaes.posts * G.anaes.fill * G.anaes.ltft, { air: true, airS: true, na: true });
  add('accpSr', 'accpSr', G.accpSr.posts * G.accpSr.fill * G.accpSr.ltft, { airS: true, na: true, fghL: true });
  add('accp', 'accp', G.accp.posts * G.accp.fill * G.accp.ltft, { na: true });
  if (G.accpAir) add('accpAir', 'accpAir', G.accpAir.posts * G.accpAir.fill * G.accpAir.ltft, { air: true, airS: true, na: true });
  ['jcf', 'accs'].forEach(k => {
    const gr = G[k], heads = gr.posts * gr.fill * gr.ltft;
    const ef = gr.fgh ? Math.max(0, (gr.rotation - gr.leadIn) / gr.rotation) : 0;
    add(k + 'E', k, heads * ef, { na: true, fghL: true });
    add(k + 'N', k, heads * (1 - ef), { na: true });
  });
  ['imt', 'fy2', 'other'].forEach(k => add(k, k, G[k].posts * G[k].fill * G[k].ltft, { na: true }));

  // mixed rota: doctors not yet signed off for FGH lose the FGH shifts on their line
  const shareGuess = core.fghMode === 'manual' ? core.fghShare : core.fghCap;
  pools.forEach(p => {
    if (p.el.mixedLoss) TYPES.forEach(t => { if (t[0] !== 'S') p.amt[t] *= (1 - shareGuess); });
  });
  // FGH nights cross-covered by the on-site FGH anaesthetic middle grade
  if (core.fghAnaes > 0) {
    const sh = Math.min(1, core.fghAnaes), amt = {};
    TYPES.forEach(t => amt[t] = 0);
    amt.Nwd = 4 * s.demand.fgh.N * sh; amt.Nwe = 3 * s.demand.fgh.N * sh;
    pools.push({ id: 'anaesX', g: 'anaesX', amt, used: Object.fromEntries(TYPES.map(t => [t, {}])), el: { fgh: true } });
  }
  pools.forEach(p => p.left = Object.assign({}, p.amt));
  const byId = Object.fromEntries(pools.map(p => [p.id, p]));

  const D = s.demand;
  const need = (lvl) => {
    const air = lvl === 'min' ? D.air : D.airT, na = lvl === 'min' ? D.na : D.naT, f = lvl === 'min' ? D.fgh : D.fghT;
    return {
      fgh: { Nwd: f.N * 4, Nwe: f.N * 3, Lwd: f.L * 5, Lwe: f.L * 2, Swd: 0, Swe: 0 },
      air: { Nwd: air.N * 4, Nwe: air.N * 3, Lwd: air.Lwd * 5, Lwe: air.Lwe * 2, Swd: air.Swd * 5, Swe: air.Swe * 2 },
      na: { Nwd: na.N * 4, Nwe: na.N * 3, Lwd: na.Lwd * 5, Lwe: na.Lwe * 2, Swd: na.Swd * 5, Swe: na.Swe * 2 }
    };
  };
  const nMin = need('min'), nT = need('target');
  const filled = { min: { fgh: {}, air: {}, na: {} }, extra: { fgh: {}, air: {}, na: {} } };
  ['min', 'extra'].forEach(l => ['fgh', 'air', 'na'].forEach(c => TYPES.forEach(t => filled[l][c][t] = 0)));

  // src: the supply type drawn on (a long day can cover a short-day slot)
  function take(poolIds, t, want, lvl, cat, cap, src) {
    src = src || t;
    let got = 0;
    for (const id of poolIds) {
      const p = byId[id]; if (!p) continue;
      let room = want - got; if (room <= 1e-9) break;
      if (cap) room = Math.min(room, cap.left / TYPE_HOURS[src]);
      const x = Math.min(room, p.left[src]);
      if (x <= 1e-12) continue;
      p.left[src] -= x; got += x;
      p.used[src][cat] = (p.used[src][cat] || 0) + x;
      if (cap) cap.left -= x * TYPE_HOURS[src];
    }
    filled[lvl][cat][t] += got;
    return got;
  }

  // FGH hours budget for SCF and specialty doctors: share of the hours they work
  const coreFull = ['scfFull', 'sdFull'].filter(id => byId[id]);
  let coreHours = 0;
  ['scfFull', 'sdFull', 'scfSrh', 'sdSrh'].forEach(id => { const p = byId[id]; if (p) TYPES.forEach(t => coreHours += p.amt[t] * TYPE_HOURS[t]); });
  let fullHours = 0;
  coreFull.forEach(id => TYPES.forEach(t => fullHours += byId[id].amt[t] * TYPE_HOURS[t]));
  const share = core.fghMode === 'manual' ? Math.min(core.fghShare, core.fghCap) : core.fghCap;
  const budget = { left: share * fullHours };
  const budget0 = budget.left;

  const otherFghL = ['accpSr', 'jcfE', 'accsE', 'icm1', 'icm2', 'icm3'].filter(id => byId[id] && byId[id].el.fghL);
  const fghOrder = ['Nwe', 'Lwe', 'Nwd', 'Lwd'];
  function fghPass(lvl, needT) {
    // training: a share of SCF and specialty doctor FGH time goes on weekday days
    if (lvl === 'min' && core.fghDayShare > 0) take(coreFull, 'Lwd', Math.min(needT.fgh.Lwd, core.fghDayShare * budget0 / 12.5), lvl, 'fgh', budget);
    // cross-covered nights first
    if (byId.anaesX) ['Nwe', 'Nwd'].forEach(t => { const already = filled.min.fgh[t] + (lvl === 'extra' ? filled.extra.fgh[t] : 0); take(['anaesX'], t, (lvl === 'min' ? nMin.fgh[t] : nT.fgh[t]) - already, lvl, 'fgh'); });
    // others first for long days (weekday always, weekend if allowed)
    ['Lwd', 'Lwe'].forEach(t => {
      if (t === 'Lwe' && !s.core.weekendFghOthers) return;
      const already = filled.min.fgh[t] + (lvl === 'extra' ? filled.extra.fgh[t] : 0);
      take(otherFghL, t, needT.fgh[t] - already, lvl, 'fgh');
    });
    fghOrder.forEach(t => {
      const already = filled.min.fgh[t] + (lvl === 'extra' ? filled.extra.fgh[t] : 0);
      const want = (lvl === 'min' ? nMin.fgh[t] : nT.fgh[t]) - already;
      if (want > 0) take(coreFull, t, want, lvl, 'fgh', budget);
    });
  }
  const airOrderLN = ['accpAir', 'icm1', 'icm2', 'icm3', 'anaes', 'scfSrh', 'sdSrh', 'scfFull', 'sdFull'];
  const airOrderS = ['accpSr', 'accpAir', 'icm1', 'icm2', 'icm3', 'anaes', 'scfSrh', 'sdSrh', 'scfFull', 'sdFull'];
  const naOrder = ['fy2', 'imt', 'other', 'accsN', 'jcfN', 'accp', 'accsE', 'jcfE', 'accpSr', 'accpAir', 'icm1', 'icm2', 'icm3', 'anaes', 'scfSrh', 'sdSrh', 'scfFull', 'sdFull'];
  function srhPass(lvl, cat) {
    TYPES.forEach(t => {
      const want = lvl === 'min' ? nMin[cat][t] : nT[cat][t] - nMin[cat][t] > 0 ? Math.max(0, nT[cat][t] - filled.min[cat][t]) : 0;
      if (want <= 0) return;
      const order = cat === 'na' ? naOrder : (t[0] === 'S' ? airOrderS : airOrderLN);
      const got = take(order, t, want, lvl, cat);
      if (t[0] === 'S' && want - got > 1e-9) take(cat === 'na' ? naOrder : airOrderLN, t, want - got, lvl, cat, null, 'L' + t.slice(1));
    });
  }
  if (core.priority === 'srh') {
    srhPass('min', 'air'); srhPass('extra', 'air'); fghPass('min', nMin);
    srhPass('min', 'na'); fghPass('extra', nT); srhPass('extra', 'na');
  } else {
    fghPass('min', nMin); srhPass('min', 'air'); srhPass('min', 'na');
    fghPass('extra', nT); srhPass('extra', 'air'); srhPass('extra', 'na');
  }

  // results
  const gap = { min: {}, target: {} };
  ['fgh', 'air', 'na'].forEach(c => {
    gap.min[c] = {}; gap.target[c] = {};
    TYPES.forEach(t => {
      gap.min[c][t] = Math.max(0, nMin[c][t] - filled.min[c][t]);
      gap.target[c][t] = Math.max(0, nT[c][t] - filled.min[c][t] - filled.extra[c][t]);
    });
  });
  let fghCoreHours = 0;
  coreFull.forEach(id => TYPES.forEach(t => fghCoreHours += (byId[id].used[t].fgh || 0) * TYPE_HOURS[t]));
  return { pools, byId, need: { min: nMin, target: nT }, filled, gap, fghShare: fullHours ? fghCoreHours / fullHours : 0, fghShareAll: coreHours ? fghCoreHours / coreHours : 0 };
}

/* ---------- costs ---------- */
function onCost(pay, c) { return pay * c.pension + Math.max(0, pay - c.niThreshold) * c.ni; }

function staffCost(s, coreState) {
  const out = {};
  ['scf', 'sd'].forEach(k => {
    const gr = s.groups[k], c = s.cost;
    let pay;
    if (k === 'scf') pay = c.scfPay;
    else { const grid = gridFor(s, gr.line); pay = c.sdPay * linePAs(grid, (gr.extraPA || 0) * 9 / 2) / 10; }
    const perWTE = pay * gr.ltft;
    const heads = coreState[k].paid;
    out[k] = { heads, pay: pay, perPerson: perWTE + onCost(perWTE, c), wages: heads * perWTE, oncost: heads * onCost(perWTE, c),
      pension: heads * perWTE * c.pension, ni: heads * Math.max(0, perWTE - c.niThreshold) * c.ni, total: heads * (perWTE + onCost(perWTE, c)) };
  });
  out.extra = 0;
  out.total = out.scf.total + out.sd.total;
  out.wages = out.scf.wages + out.sd.wages; out.oncost = out.scf.oncost + out.sd.oncost;
  out.pension = out.scf.pension + out.sd.pension; out.ni = out.scf.ni + out.sd.ni;
  return out;
}

function locumCost(s, alloc) {
  const c = s.cost, lvl = c.locumTo === 'target' ? 'target' : 'min';
  let shifts = 0, cost = 0, hours = 0;
  const byCat = { fgh: {}, air: {}, na: {} };
  ['fgh', 'air', 'na'].forEach(cat => TYPES.forEach(t => {
    const g = (cat === 'na' && c.locumScope !== 'all') ? 0 : alloc.gap[lvl][cat][t] * 52 * c.locumFill;
    const rate = cat === 'na' ? c.naRate : c.rate[t];
    byCat[cat][t] = g;
    shifts += g; hours += g * TYPE_HOURS[t]; cost += g * TYPE_HOURS[t] * rate;
  }));
  return { shifts, hours, cost, byCat };
}

/* ---------- headline run ---------- */
function steadyCore(s) {
  const out = {};
  ['scf', 'sd'].forEach(k => {
    const gr = s.groups[k], n = (gr.posts || 0) + (gr.newPosts || 0), pf = pipeline(s.core, s.core.stay[k]);
    out[k] = { full: n * pf.full, srhOnly: n * pf.srhOnly, super: n * pf.super, paid: n * pf.paid, vacant: n * pf.vacant };
  });
  return out;
}

function summarise(s, alloc, cs) {
  const loc = locumCost(s, alloc), staff = staffCost(s, cs);
  if (alloc.byId.anaesX) { const nights = (TYPES.reduce((a, t) => a + (alloc.byId.anaesX.used[t].fgh || 0), 0)) * 52; staff.extra = nights * (s.cost.anaesNight || 0); staff.total += staff.extra; staff.anaesNights = nights; }
  let surplus = 0, surplusCore = 0; alloc.pools.forEach(p => { const v = (p.left.Swd + p.left.Swe) * 52; surplus += v; if (p.g === 'scf' || p.g === 'sd') surplusCore += v; });
  let needAll = 0, fillAll = 0; ['fgh', 'air', 'na'].forEach(c => TYPES.forEach(t => { needAll += alloc.need.min[c][t] * 52; fillAll += alloc.filled.min[c][t] * 52; }));
  const sum = (lvl, cat, types) => (types || TYPES).reduce((a, t) => a + alloc.need[lvl === 'min' ? 'min' : 'target'][cat][t], 0);
  const fil = (cat, types) => (types || TYPES).reduce((a, t) => a + alloc.filled.min[cat][t], 0);
  const cover = {
    fgh: fil('fgh') / Math.max(1e-9, sum('min', 'fgh')),
    fghOOH: fil('fgh', ['Nwd', 'Nwe', 'Lwe']) / Math.max(1e-9, sum('min', 'fgh', ['Nwd', 'Nwe', 'Lwe'])),
    air: fil('air') / Math.max(1e-9, sum('min', 'air')),
    na: fil('na') / Math.max(1e-9, sum('min', 'na'))
  };
  const tgtNeed = ['fgh', 'air', 'na'].reduce((a, c) => a + sum('t', c), 0);
  const tgtGap = ['fgh', 'air', 'na'].reduce((a, c) => a + TYPES.reduce((b, t) => b + alloc.gap.target[c][t], 0), 0);
  cover.target = 1 - tgtGap / Math.max(1e-9, tgtNeed);
  const airMinAll = (fil('fgh') + fil('air')) / Math.max(1e-9, sum('min', 'fgh') + sum('min', 'air'));
  cover.airwayAll = airMinAll;
  // how SCF and specialty doctors are used (shifts per year)
  const use = {};
  ['scf', 'sd'].forEach(k => {
    const u = { fghN: 0, fghL: 0, air: 0, na: 0, spare: 0, lost: 0 };
    [k + 'Full', k + 'Srh'].forEach(id => {
      const p = alloc.byId[id]; if (!p) return;
      TYPES.forEach(t => {
        const us = p.used[t];
        if (us.fgh) { if (t[0] === 'N') u.fghN += us.fgh * 52; else u.fghL += us.fgh * 52; }
        u.air += (us.air || 0) * 52; u.na += (us.na || 0) * 52; u.spare += p.left[t] * 52;
      });
    });
    use[k] = u;
  });
  return { locum: loc, staff, total: loc.cost + staff.total, cover, use, fghShare: alloc.fghShare, fghShareAll: alloc.fghShareAll,
    surplus, surplusCore, shifts: { need: needAll, covered: fillAll } };
}

function run(s) {
  const cs = steadyCore(s);
  const alloc = allocate(s, cs);
  const sum = summarise(s, alloc, cs);
  return { alloc, core: cs, ...sum };
}

// what one more post in the growth group buys
function marginal(s) {
  const k = (s.groups.sd.posts + s.groups.sd.newPosts) > 0 ? 'sd' : 'scf';
  const base = run(s);
  const s2 = JSON.parse(JSON.stringify(s)); s2.groups[k].newPosts += 1;
  const r2 = run(s2);
  return { group: k, staff: r2.staff.total - base.staff.total, locum: r2.locum.cost - base.locum.cost, shifts: r2.locum.shifts - base.locum.shifts };
}

/* ---------- theoretical airway need ---------- */
function theoretical(s, lvl) {
  const D = s.demand, air = lvl === 'target' ? D.airT : D.air, f = lvl === 'target' ? D.fghT : D.fgh;
  const dayPeople = air.Lwe + air.Swe + f.L, nightPeople = air.N + f.N;
  const perWeekend = dayPeople + nightPeople;
  const lines = perWeekend * s.weekendCap;
  const grs = ['icm1', 'icm2', 'icm3', 'anaes', 'scf'].map(k => s.groups[k]);
  const av = grs.reduce((a, g) => a + availability(g, s.core, g.tier === 'core'), 0) / grs.length;
  const hoursWk = (air.Lwd * 5 + air.Lwe * 2 + air.N * 7 + f.L * 7 + f.N * 7) * 12.5 + (air.Swd * 5 + air.Swe * 2) * 8;
  const lineH = lineHours(LINES.scf_current.grid);
  return { dayPeople, nightPeople, perWeekend, lines, avail: av, weekendBound: lines / av, hoursWk, hoursBound: hoursWk / (lineH * av) };
}

/* ---------- 24-month view ---------- */
function months(s, n) {
  n = n || 24;

const UR_TIP = 'How sure we are. Each plan is worked out again with the inputs we are least sure of set low and then high: ' + UNC.map(u => u.n.charAt(0).toLowerCase() + u.n.slice(1)).join('; ') + '. The swings are added up on the basis that they will not all go the same way at once (square root of the sum of squares). Both ends are paired with Now worked out the same way.';
const UR = {}; let urQ = [], urBusy = false;
const prepS = x => { M2.syncAccp(x); syncT(x); return x; };
function urNeed(key, s) {
  const id = MODE + '|' + key;

}
function urStep() {

}
function ensureRanges() {

}
const rss = xs => Math.sqrt(xs.reduce((a, x) => a + x * x, 0));
// swings for a plan's cost, or for its difference from Now when paired

/* ---------- workload and training: facts beside the cost ---------- */

];
function renderBuy() {

      <button class="bt btl" data-opensheet="dsheet"><span class="lab">Salford spare people on weekday days${iI('Everyone on days at Salford above the minimum of ' + minD + '. They go to teaching, training and other learning. Tap for the chart.')}</span><b class="num">${num(sp, 1)} a day</b><span class="dd">${Math.abs(sp - spN) < 0.05 ? 'Chart' : 'Now ' + num(spN, 1) + ' a day'} ›</span></button></div>

/* ---------- compute ---------- */

  el('tourbtn').onclick = start; el('tclose').onclick = end;
  el('tnext').onclick = () => { if (i === STEPS.length - 1) end(); else show(i + 1); };

if (LINK) {

registerAll(); renderSavebar();
renderMode(); nowRes = M2.simulate(clone(NOW), 40, 5); presetRes.now = { r: nowRes, s: make('now') };

(async () => {

  .mtabs button { font: inherit; border: 0; background: transparent; color: #6e6e73; display: grid; justify-items: center; gap: 2px; padding: 6px 4px; border-radius: 12px; font-size: 11px; font-weight: 600; letter-spacing: .02em; }
  .mtabs button b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #ececef; color: #3a3a3c; font-size: 12px; }
  .mtabs button span { font-size: 12px; }
  .mtabs button.on { color: #1d1d1f; background: #f0f0f3; }
  .mtabs button.on b { background: #1d1d1f; color: #fff; }
  .mtabs .mt-sub { font-size: 10px; font-weight: 500; color: #8a8a8f; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheetin { padding: 16px; width: 100%; }
  .sheet { z-index: 30; }
  .sheetin table { display: block; max-width: 100%; overflow-x: auto; }
  .tour .tcard { max-height: 46vh; overflow: auto; }
  .kl2 { grid-template-columns: 10px minmax(0,1fr) auto; row-gap: 2px; }
  .kl2 .dd { grid-column: 2 / -1; margin-bottom: 6px; }
}
</style>
<nav class="mtabs" id="mtabs" aria-label="Sections">
  <button data-mt="plans"><b>1</b><span>Plans</span><i class="mt-sub" id="mtPlan"></i></button>
  <button data-mt="inputs"><b>2</b><span>Inputs</span><i class="mt-sub">Change anything</i></button>
  <button data-mt="outs"><b>3</b><span>Results</span><i class="mt-sub" id="mtRes"></i></button>
</nav>
<script>
(() => {
  const app = document.getElementById('app'), bar = document.getElementById('mtabs');
  const mq = window.matchMedia('(max-width: 760px)');
  window.mIsMobile = () => mq.matches;
  window.mTab = (t, top) => {
    app.dataset.tab = t;
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mt === t));
    if (top !== false && mq.matches) window.scrollTo(0, 0);
  };
  bar.addEventListener('click', e => { const b = e.target.closest('[data-mt]'); if (b) window.mTab(b.dataset.mt); });
  window.mTab('plans', false);
  // picking a plan on a phone takes you straight to its results
  document.getElementById('map').addEventListener('click', e => {
    if (!mq.matches) return;
    const t = e.target.closest('button'); if (!t || e.target.closest('[data-costof]')) return;
    if (document.querySelector('#map input[data-rename]')) return;
    if (t.dataset.preset || t.dataset.saved) setTimeout(() => window.mTab('outs'), 60);
  });
  // keep the tab labels in step with the page
  const sync = () => {
    const n = document.getElementById('outName'); document.getElementById('mtPlan').textContent = n ? n.textContent : '';
    const hl = document.getElementById('hl'); const v = hl && hl.querySelector('.big, .v, b');
    const cost = hl ? (hl.textContent.match(/£[\d,]+/) || [''])[0] : '';
    document.getElementById('mtRes').textContent = cost;
  };
  new MutationObserver(sync).observe(document.getElementById('hl'), { childList: true, subtree: true, characterData: true });
  new MutationObserver(sync).observe(document.getElementById('outName'), { childList: true, subtree: true, characterData: true });
  sync();
})();
</script>
